<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SSE lab</title>
  <style>
    body { font: 14px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; margin: 2rem; max-width: 52rem; }
    #status { color: #b00020; }
    #out > div { padding: 2px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>SSE lab</h1>
  <p>
    status: <b id="status">connecting...</b> |
    last id: <b id="last">-</b> |
    received: <b id="count">0</b>
  </p>
  <div id="out"></div>

  <script>
    const statusEl = document.getElementById('status');
    const lastEl = document.getElementById('last');
    const countEl = document.getElementById('count');
    const outEl = document.getElementById('out');
    let received = 0;

    const es = new EventSource('/stream');

    es.onopen = () => {
      statusEl.textContent = 'open';
    };

    es.onerror = () => {
      statusEl.textContent = 'error (readyState=' + es.readyState + ')';
    };

    es.onmessage = (e) => {
      received += 1;
      lastEl.textContent = e.lastEventId;
      countEl.textContent = String(received);

      const row = document.createElement('div');
      row.textContent = e.lastEventId + '  ' + e.data;
      outEl.prepend(row);
    };
  </script>
</body>
</html>
